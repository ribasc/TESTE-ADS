<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Painel do casal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="painel.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-heart">♡</span>
        <span id="brand-names">Nosso casamento</span>
      </div>
      <nav class="nav" id="nav">
        <a href="#/inicio" data-route="inicio"><span class="ico">◎</span><span>Início</span></a>
        <a href="#/tarefas" data-route="tarefas"><span class="ico">✓</span><span>Tarefas</span></a>
        <a href="#/orcamento" data-route="orcamento"><span class="ico">$</span><span>Orçamento</span></a>
        <a href="#/convidados" data-route="convidados"><span class="ico">☺</span><span>Convidados</span></a>
        <a href="#/fornecedores" data-route="fornecedores"><span class="ico">◇</span><span>Fornecedores</span></a>
        <a href="#/detalhes" data-route="detalhes"><span class="ico">✎</span><span>Detalhes</span></a>
      </nav>
      <div class="sidebar-foot">
        <span class="muted small" id="who"></span>
        <button class="btn small ghost" id="logout">Sair</button>
      </div>
    </aside>
    <main class="content" id="view" aria-live="polite"></main>
  </div>

  <dialog id="modal">
    <form method="dialog" id="modal-form" novalidate>
      <header class="modal-head">
        <h2 id="modal-title"></h2>
        <button class="btn ghost small" value="cancel" formnovalidate aria-label="Fechar">✕</button>
      </header>
      <div class="modal-body" id="modal-body"></div>
      <div class="error" id="modal-error"></div>
      <footer class="modal-foot">
        <button class="btn danger ghost" type="button" id="modal-delete" hidden>Excluir</button>
        <span class="spacer"></span>
        <button class="btn" value="cancel" formnovalidate>Cancelar</button>
        <button class="btn primary" id="modal-save" value="save">Salvar</button>
      </footer>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
